[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.10.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false
repository = "https://github.com/heidrickla/ha-duplex-chat"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# Plain HTTP to the broker on the LAN; no TLS stack.
ureq = { version = "3.5", default-features = false, features = ["json"] }
duplex-proto = { version = "0.10.0", path = "crates/duplex-proto" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
strip = true
