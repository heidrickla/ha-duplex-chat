name: Release

# A tag v<version> builds the duplex binary for Windows and for Linux on x86_64 and aarch64 (musl, one
# static file), and duplex-opencode and duplex-waker for Windows, and attaches them to the release with their checksums.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    if: github.server_url == 'https://github.com'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-2025
            packages: -p duplex -p duplex-waker
            archive: zip
          - target: x86_64-unknown-linux-musl
            os: ubuntu-26.04
            packages: -p duplex
            archive: tar.gz
          - target: aarch64-unknown-linux-musl
            os: ubuntu-26.04
            packages: -p duplex
            archive: tar.gz
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # The runner images carry rustup; the toolchain is pinned here.
      - name: Rust 1.98.1
        shell: bash
        run: |
          rustup toolchain install 1.98.1 --profile minimal --target "${{ matrix.target }}"
          rustup default 1.98.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - name: The tag names this version
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME is not v$version" >&2; exit 1; }
      # The musl targets are self-contained, so a cross gcc only has to drive the link.
      - name: Linker for aarch64
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} ${{ matrix.packages }}
      - name: Package
        shell: bash
        run: |
          mkdir dist
          out="target/${{ matrix.target }}/release"
          if [ "${{ matrix.archive }}" = zip ]; then
            for bin in duplex duplex-opencode duplex-waker; do
              pwsh -NoProfile -Command "Compress-Archive -Path '$out/$bin.exe' -DestinationPath 'dist/$bin-${{ matrix.target }}.zip'"
            done
          else
            tar -C "$out" -czf "dist/duplex-${{ matrix.target }}.tar.gz" duplex
          fi
          ls -l dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish
    if: github.server_url == 'https://github.com'
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          ls -l
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes "Binaries for the duplex adapter, the Windows OpenCode adapter and the Windows waker. Changes: duplex_broker/CHANGELOG.md." \
            *
