name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A Gitea or Forgejo runner reads .github/workflows too; these jobs run on GitHub only
# (.gitea/workflows/ci.yml is the forge's copy).
jobs:
  python:
    name: Python gates
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # The add-on runs on the base image's python3, 3.12.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install --quiet -e "duplex_broker[test]"
      - name: pytest
        run: python -m pytest -c duplex_broker/pyproject.toml duplex_broker/tests adapters/codex -q -p no:cacheprovider
      - name: ruff
        run: |
          python -m ruff check duplex_broker adapters tools
          python -m ruff format --check duplex_broker adapters tools
      - name: mypy
        run: python -m mypy --config-file duplex_broker/pyproject.toml duplex_broker/src duplex_broker/tests
      - name: Contract coverage
        run: python tools/contract_coverage.py

  rust:
    name: Rust gates (${{ matrix.os }})
    if: github.server_url == 'https://github.com'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, windows-2025]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # The runner images carry rustup; the toolchain is pinned here.
      - name: Rust 1.98.1
        shell: bash
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
          rustup default 1.98.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The tests that run against the real broker need a Python holding its dependencies.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Broker for the integration tests
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/broker"
          if [ -x "$RUNNER_TEMP/broker/bin/python" ]; then py="$RUNNER_TEMP/broker/bin/python"; else py="$RUNNER_TEMP/broker/Scripts/python.exe"; fi
          "$py" -m pip install --quiet ./duplex_broker
          echo "DUPLEX_BROKER_PYTHON=$py" >> "$GITHUB_ENV"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests, with the ones that need the real broker
        run: cargo test --workspace --locked -- --include-ignored
      - name: Licenses, advisories and sources
        if: runner.os == 'Linux'
        run: |
          cargo install --locked cargo-deny
          cargo deny check

  addon:
    name: Add-on lint
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: duplex_broker/Dockerfile
          failure-threshold: info
      - name: App linter
        uses: frenck/action-app-linter@b9cfd1bc62ba60d2c4fc96317b5f7ada5923f4a7 # v2.21.1
        with:
          path: ./duplex_broker

  image:
    name: Add-on image (${{ matrix.arch }})
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      # The arguments the Supervisor passes: the base image of the architecture, from build.yaml.
      - name: Build
        run: >-
          docker buildx build --load --platform ${{ matrix.platform }}
          --build-arg BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base:3.21
          --build-arg BUILD_ARCH=${{ matrix.arch }} --build-arg BUILD_VERSION=ci
          -t duplex-broker:${{ matrix.arch }} duplex_broker
      - name: Architecture
        run: >-
          docker image inspect --format '{{.Architecture}}' duplex-broker:${{ matrix.arch }}
          | grep -qxF "$(basename ${{ matrix.platform }})"
      # A fresh install with empty options: the broker answers ready with every optional member off.
      - name: Run
        run: |
          name=duplex-broker-ci-${{ matrix.arch }}
          mkdir -p "$RUNNER_TEMP/data"
          echo '{}' > "$RUNNER_TEMP/data/options.json"
          docker create --name "$name" --platform ${{ matrix.platform }} -e SUPERVISOR_TOKEN=ci duplex-broker:${{ matrix.arch }} > /dev/null
          docker cp "$RUNNER_TEMP/data/." "$name:/data"
          docker start "$name" > /dev/null
          ok=0
          for _ in $(seq 1 60); do
            if docker exec "$name" curl -fsS http://127.0.0.1:8790/health | tee /dev/stderr | grep -q '"ready":true'; then ok=1; break; fi
            sleep 2
          done
          docker logs "$name" 2>&1 | tail -n 20
          docker rm -f "$name" > /dev/null
          test "$ok" = 1
