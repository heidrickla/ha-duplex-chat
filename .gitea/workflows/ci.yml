name: CI

# The forge's copy of .github/workflows/ci.yml: the same jobs on the forge runner (label ubuntu-latest,
# the only label the forge's runner offers). There is no Windows runner on the forge: the Windows leg
# of the Rust gates runs on GitHub. The image job reaches the forge host's Docker daemon: the image
# and container carry the run's id and are removed, and the options go in with docker cp.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: Python gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        timeout-minutes: 15
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        timeout-minutes: 15
        with:
          python-version: "3.12"
      # A venv of the job's own: the image's Python is externally managed.
      - name: Install
        timeout-minutes: 15
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet -e "duplex_broker[test]"
      - name: pytest
        timeout-minutes: 15
        run: '"$RUNNER_TEMP/venv/bin/python" -m pytest -c duplex_broker/pyproject.toml duplex_broker/tests adapters/codex -q -p no:cacheprovider'
      - name: ruff
        timeout-minutes: 15
        run: |
          "$RUNNER_TEMP/venv/bin/python" -m ruff check duplex_broker adapters tools
          "$RUNNER_TEMP/venv/bin/python" -m ruff format --check duplex_broker adapters tools
      - name: mypy
        timeout-minutes: 15
        run: '"$RUNNER_TEMP/venv/bin/python" -m mypy --config-file duplex_broker/pyproject.toml duplex_broker/src duplex_broker/tests'
      - name: Contract coverage
        timeout-minutes: 15
        run: '"$RUNNER_TEMP/venv/bin/python" tools/contract_coverage.py'

  rust:
    name: Rust gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        timeout-minutes: 15
      # The forge's runner image has no rustup: rustup-init is fetched and checked by its sha256.
      - name: Rust 1.98.1
        timeout-minutes: 15
        run: |
          r=1.29.1
          i="$RUNNER_TEMP/rustup-init"
          curl --proto '=https' --tlsv1.2 -sSf -o "$i" "https://static.rust-lang.org/rustup/archive/$r/x86_64-unknown-linux-gnu/rustup-init"
          echo "dda7234360b7f578ca8b0ddcb80145646fa61a67c1720a5abc7051b35c9fcb71  $i" | sha256sum -c -
          chmod +x "$i"
          "$i" -y --profile minimal --default-toolchain 1.98.1 --component clippy,rustfmt
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        timeout-minutes: 15
        with:
          python-version: "3.12"
      - name: Broker for the integration tests
        timeout-minutes: 15
        run: |
          python -m venv "$RUNNER_TEMP/broker"
          "$RUNNER_TEMP/broker/bin/python" -m pip install --quiet ./duplex_broker
          echo "DUPLEX_BROKER_PYTHON=$RUNNER_TEMP/broker/bin/python" >> "$GITHUB_ENV"
      - run: cargo fmt --all --check
        timeout-minutes: 15
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
        timeout-minutes: 30
      - name: Tests, with the ones that need the real broker
        timeout-minutes: 30
        run: cargo test --workspace --locked -- --include-ignored
      - name: Licenses, advisories and sources
        timeout-minutes: 30
        run: |
          cargo install --locked cargo-deny
          cargo deny check

  addon:
    name: Add-on lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        timeout-minutes: 15
      - name: hadolint
        timeout-minutes: 15
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: duplex_broker/Dockerfile
          failure-threshold: info
      - name: App linter
        timeout-minutes: 15
        uses: frenck/action-app-linter@b9cfd1bc62ba60d2c4fc96317b5f7ada5923f4a7 # v2.21.1
        with:
          path: ./duplex_broker

  image:
    name: Add-on image (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    env:
      TAG: duplex-broker-ci:${{ github.run_id }}-${{ matrix.arch }}
      NAME: duplex-broker-ci-${{ github.run_id }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        timeout-minutes: 15
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        timeout-minutes: 10
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        timeout-minutes: 10
      - name: Build
        timeout-minutes: 20
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./duplex_broker
          platforms: ${{ matrix.platform }}
          pull: true
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base:3.21
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_VERSION=ci
          load: true
          tags: ${{ env.TAG }}
          push: false
      # The probe is retried for up to two minutes: under QEMU the first answer can take a while.
      - name: Run the image
        timeout-minutes: 10
        run: |
          docker image inspect --format '{{.Architecture}}' "$TAG" | grep -qxF "$(basename ${{ matrix.platform }})"
          mkdir -p "$RUNNER_TEMP/data"
          echo '{}' > "$RUNNER_TEMP/data/options.json"
          docker create --name "$NAME" --platform ${{ matrix.platform }} -e SUPERVISOR_TOKEN=ci "$TAG" > /dev/null
          docker cp "$RUNNER_TEMP/data/." "$NAME:/data"
          docker start "$NAME" > /dev/null
          ok=0
          for _ in $(seq 1 60); do
            if docker exec "$NAME" curl -fsS http://127.0.0.1:8790/health | tee /dev/stderr | grep -q '"ready":true'; then ok=1; break; fi
            sleep 2
          done
          docker logs "$NAME" 2>&1 | tail -n 20
          test "$ok" = 1
      - name: Remove the container and image
        if: always()
        run: |
          docker rm -f "$NAME" > /dev/null 2>&1 || true
          docker image rm -f "$TAG" > /dev/null 2>&1 || true
